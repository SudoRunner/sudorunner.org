<script>
(function () {
  var steps = {
    "/start-here/": {
      step: 0,
      title: "Start Here: 60-Second Review Workflow",
      purpose: "Begin here, then follow the guided review path through resume, ServiceNow SecOps, projects, OT/ICS, AI security, and contact.",
      progress: "Start Here",
      prevLabel: "← Home",
      prevUrl: "/",
      nextLabel: "Begin: Resume →",
      nextUrl: "/resume/"
    },

    "/resume/": {
      step: 1,
      title: "Step 1: Resume",
      purpose: "Start with the public resume overview, professional focus areas, education, certifications, and portfolio highlights.",
      progress: "Step 1 of 6",
      prevLabel: "← Previous: Start Here",
      prevUrl: "/start-here/",
      nextLabel: "Next: ServiceNow SecOps →",
      nextUrl: "/servicenow-secops/"
    },

    "/servicenow-secops/": {
      step: 2,
      title: "Step 2: ServiceNow SecOps",
      purpose: "Review professional delivery, Vulnerability Response lab evidence, workflow guidance, and portfolio-safe ServiceNow concepts.",
      progress: "Step 2 of 6",
      prevLabel: "← Previous: Resume",
      prevUrl: "/resume/",
      nextLabel: "Next: Projects →",
      nextUrl: "/projects/"
    },

    "/projects/": {
      step: 3,
      title: "Step 3: Projects",
      purpose: "Review the project gallery covering ServiceNow, cybersecurity labs, Java/software foundations, network traffic analysis, malware investigation, OT/ICS, and web design.",
      progress: "Step 3 of 6",
      prevLabel: "← Previous: ServiceNow SecOps",
      prevUrl: "/servicenow-secops/",
      nextLabel: "Next: OT/ICS Security →",
      nextUrl: "/ot-ics-security/"
    },

    "/ot-ics-security/": {
      step: 4,
      title: "Step 4: OT/ICS Security",
      purpose: "Review OT/ICS security interests, SCADA and PLC concepts, cyber-physical risk, operational disruption, and recovery validation.",
      progress: "Step 4 of 6",
      prevLabel: "← Previous: Projects",
      prevUrl: "/projects/",
      nextLabel: "Next: AI & Security →",
      nextUrl: "/ai-security/"
    },

    "/ai-security/": {
      step: 5,
      title: "Step 5: AI & Security",
      purpose: "Review AI-assisted SecOps concepts, vulnerability ownership ideas, human-in-the-loop workflow thinking, and risk translation concepts.",
      progress: "Step 5 of 6",
      prevLabel: "← Previous: OT/ICS Security",
      prevUrl: "/ot-ics-security/",
      nextLabel: "Next: Contact →",
      nextUrl: "/contact/"
    },

    "/contact/": {
      step: 6,
      title: "Step 6: Contact",
      purpose: "Complete the review path with professional contact options, LinkedIn, and resume access.",
      progress: "Step 6 of 6",
      prevLabel: "← Previous: AI & Security",
      prevUrl: "/ai-security/",
      nextLabel: "Review Complete · Restart Path",
      nextUrl: "/start-here/"
    }
  };

  var path = window.location.pathname;

  if (!path.endsWith("/")) {
    path = path + "/";
  }

  var data = steps[path];
  var nav = document.querySelector("[data-sr-review-nav]");

  if (!nav || !data) {
    if (nav) {
      nav.remove();
    }
    return;
  }

  nav.querySelector("[data-sr-review-title]").textContent = data.title;
  nav.querySelector("[data-sr-review-purpose]").textContent = data.purpose;
  nav.querySelector("[data-sr-review-progress]").textContent = data.progress;

  var prev = nav.querySelector("[data-sr-review-prev]");
  var next = nav.querySelector("[data-sr-review-next]");

  prev.textContent = data.prevLabel;
  prev.href = data.prevUrl;

  next.textContent = data.nextLabel;
  next.href = data.nextUrl;

  nav.querySelectorAll("[data-sr-step-link]").forEach(function (link) {
    link.classList.remove("is-active");

    if (Number(link.getAttribute("data-step")) === data.step) {
      link.classList.add("is-active");
    }
  });

  nav.style.display = "";
})();
</script>
