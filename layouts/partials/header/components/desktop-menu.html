<style>
.sr-desktop-menu {
  display: flex !important;
  align-items: center !important;
  justify-content: flex-end !important;
  width: 100% !important;
  position: relative !important;
  z-index: 9999 !important;
}

.sr-nav-list {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  justify-content: flex-end !important;
  gap: 1.15rem !important;
  margin: 0 !important;
  padding: 0 !important;
  list-style: none !important;
}

.sr-nav-item {
  position: relative !important;
  display: inline-flex !important;
}

.sr-nav-link,
.sr-dropdown-link {
  color: rgba(241, 245, 249, 0.94) !important;
  font-weight: 800 !important;
  text-decoration: none !important;
  white-space: nowrap !important;
}

.sr-nav-link:hover,
.sr-dropdown-link:hover {
  color: #60a5fa !important;
}

.sr-nav-caret {
  color: rgba(148, 163, 184, 0.9) !important;
  font-size: 0.78rem !important;
}

.sr-dropdown {
  position: absolute !important;
  top: calc(100% + 0.7rem) !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  min-width: 22rem !important;
  margin: 0 !important;
  padding: 1rem 0 !important;
  list-style: none !important;
  border: 1px solid rgba(148, 163, 184, 0.22) !important;
  border-radius: 1.15rem !important;
  background: #0b1220 !important;
  box-shadow: 0 24px 60px rgba(2, 6, 23, 0.58) !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
  z-index: 99999 !important;
}

.sr-has-dropdown:hover .sr-dropdown,
.sr-has-dropdown:focus-within .sr-dropdown {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
}

.sr-dropdown-link {
  display: block !important;
  padding: 0.72rem 1.35rem !important;
  line-height: 1.25 !important;
}

.sr-dropdown-link:hover {
  background: rgba(59, 130, 246, 0.1) !important;
}

@media (max-width: 1024px) {
  .sr-desktop-menu {
    display: none !important;
  }
}
</style>

<nav class="sr-desktop-menu" aria-label="Main navigation">
  <ul class="sr-nav-list">
    {{ range .Site.Menus.main }}
      {{ if not .Parent }}
        <li class="sr-nav-item {{ if .HasChildren }}sr-has-dropdown{{ end }}">
          <a class="sr-nav-link" href="{{ .URL }}">{{ .Name }}{{ if .HasChildren }}{{ end }}</a>
          {{ if .HasChildren }}
            <ul class="sr-dropdown">
              {{ range .Children }}
                <li><a class="sr-dropdown-link" href="{{ .URL }}">{{ .Name }}</a></li>
              {{ end }}
            </ul>
          {{ end }}
        </li>
      {{ end }}
    {{ end }}
  </ul>
</nav>
