{{ define "main" }}

    {{ if ne .Params.showTitle false }}
      <header class="mb-10">
        <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
          {{ .Title | emojify }}
        </h1>
      </header>
    {{ end }}


<section class="sr-page-content">
  {{ .Content }}
</section>

{{ partial "components/review-path-nav.html" . }}


  </article>
{{ end }}
